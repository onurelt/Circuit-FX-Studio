name: Build Circuit FX Studio Vita AutoMix Foundation
on:
  push:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audio-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test the production audio engine
        run: |
          gcc -std=c99 -O2 -Wall -Wextra -Werror -DHOST_TEST src/render.c src/wav.c src/presets.c -lm -o tests/render
          gcc -std=c99 -O2 -Wall -Wextra -Werror -Isrc -Ithird_party/minimp3 src/mp3_import.c src/wav.c tests/mp3_convert.c -lm -o tests/mp3_convert
          gcc -std=c99 -O2 -Wall -Wextra -Werror -Isrc -Ithird_party/minimp3 src/mp3_import.c src/wav.c tests/mp3_waveform.c -lm -o tests/mp3_waveform
          tests/mp3_waveform tests/fixtures/test-stereo-44100.mp3
          gcc -std=c99 -O2 -Wall -Wextra -Werror -Isrc src/beatmatch.c src/render.c src/wav.c src/presets.c tests/beatmatch_tool.c -lm -o tests/beatmatch_tool
          python3 tests/test_beatmatch.py
          gcc -std=c99 -O2 -Wall -Wextra -Werror -Isrc src/automix.c tests/test_automix.c -lm -o /tmp/test-automix
          /tmp/test-automix
          gcc -std=c99 -O2 -Wall -Wextra -Werror -Isrc src/vocal.c src/render.c src/wav.c src/presets.c tests/vocal_tool.c -lm -o tests/vocal_tool
          python3 tests/test_vocal.py
          python3 tests/test_audio.py
          python3 tests/test_presets.py
          python3 tests/test_samples.py
          python3 tests/test_mp3.py
      - name: Address and undefined-behavior sanitizers
        run: |
          gcc -std=c99 -O1 -g -fsanitize=address,undefined -fno-omit-frame-pointer -no-pie -DHOST_TEST src/render.c src/wav.c src/presets.c -lm -o tests/render
          gcc -std=c99 -O1 -g -fsanitize=address,undefined -fno-omit-frame-pointer -no-pie -Isrc -Ithird_party/minimp3 src/mp3_import.c src/wav.c tests/mp3_convert.c -lm -o tests/mp3_convert_asan
          gcc -std=c99 -O1 -g -fsanitize=address,undefined -fno-omit-frame-pointer -no-pie -Isrc src/vocal.c src/render.c src/wav.c src/presets.c tests/vocal_tool.c -lm -o tests/vocal_tool_asan
          python3 tests/test_audio.py
          python3 tests/test_presets.py
          python3 tests/test_samples.py
          MP3_IMPORT_EXE=tests/mp3_convert_asan ASAN_OPTIONS=detect_leaks=0 python3 tests/test_mp3.py
          VOCAL_TOOL=tests/vocal_tool_asan ASAN_OPTIONS=detect_leaks=0 python3 tests/test_vocal.py
      - name: Compile and exercise production UI
        run: |
          gcc -std=c99 -O2 -Wall -Wextra -Werror -DHOST_UI -Isrc vita/ui.c src/presets.c -lm -o /tmp/ui
          /tmp/ui
          gcc -std=c99 -O1 -g -fsanitize=address,undefined -fno-omit-frame-pointer -no-pie -DHOST_UI -DUI_TEST -Isrc -Ivita tests/test_ui.c vita/ui.c src/presets.c -lm -o /tmp/test-ui
          /tmp/test-ui
          gcc -std=c11 -O2 -Wall -Wextra -Werror -Itests/mock -Isrc -Ivita tests/test_gpu_ui.c vita/ui.c src/presets.c -lm -o /tmp/test-gpu-ui
          /tmp/test-gpu-ui
  build:
    needs: audio-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned VitaSDK
        run: |
          curl -L --fail --retry 3 https://github.com/vitasdk/autobuilds/releases/download/sdk-snapshot-20261015.850.1/vitasdk-x86_64-linux-gnu-2026-10-15_05-01-16.tar.bz2 -o /tmp/vitasdk.tar.bz2
          echo '801f483928523fe63547faf58a7dfdaca7482b26c33af0064acea96a906f7662  /tmp/vitasdk.tar.bz2' | sha256sum --check
          mkdir -p "$RUNNER_TEMP/vita"
          tar -xjf /tmp/vitasdk.tar.bz2 -C "$RUNNER_TEMP/vita"
          echo "VITASDK=$RUNNER_TEMP/vita/vitasdk" >> "$GITHUB_ENV"
          echo "$RUNNER_TEMP/vita/vitasdk/bin" >> "$GITHUB_PATH"
      - name: Install Vita2D graphics library
        run: |
          "$VITASDK/bin/vdpm" refresh 2026.08
          printf 'y\n' | "$VITASDK/bin/vdpm" install libvita2d
      - name: Compile installable VPK
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --parallel 2
          python3 tests/check_vpk.py build/CircuitFX-AutoMix-Foundation.vpk
      - uses: actions/upload-artifact@v4
        with:
          name: Circuit-FX-Studio-Vita-AutoMix-Foundation
          path: |
            build/CircuitFX-AutoMix-Foundation.vpk
            README.md
            HARDWARE_TESTING.md
          if-no-files-found: error

  # Persistent prerelease for commits explicitly marked [publish-vpk].
  # Unlike short-lived Actions artifacts, release assets remain downloadable
  # until deliberately deleted from GitHub.
  release:
    needs: build
    if: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[publish-vpk]') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Circuit-FX-Studio-Vita-AutoMix-Foundation
          path: dist
      - name: Publish verified build to GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SHORT_SHA="${GITHUB_SHA:0:8}"
          gh release create "automix-foundation-${SHORT_SHA}" \
            "dist/CircuitFX-AutoMix-Foundation.vpk" \
            --repo "${GITHUB_REPOSITORY}" \
            --target "${GITHUB_SHA}" \
            --title "Circuit FX AutoMix Foundation ${SHORT_SHA}" \
            --notes "Experimental automatic cue/energy/approximate phrase-grid transitions. CI-tested build, not verified on PS Vita hardware. No real AI stem separation yet." \
            --prerelease

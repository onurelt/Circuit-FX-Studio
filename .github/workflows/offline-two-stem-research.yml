name: Research offline two-stem AI (host reference only)
on:
  push:
    branches:
      - experiment/offline-two-stem-vita-feasibility
    paths:
      - "experiments/two_stem_poc/**"
      - ".github/workflows/offline-two-stem-research.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  host-reference:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        model: [int8]
        seconds: [5, 20]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install CPU model runtime
        run: python -m pip install numpy soundfile sherpa-onnx
      - name: Download published two-stem ONNX model (not checked into repo)
        run: |
          curl -fsSL --retry 3 "https://github.com/k2-fsa/sherpa-onnx/releases/download/source-separation-models/sherpa-onnx-spleeter-2stems-${{ matrix.model }}.tar.bz2" -o /tmp/spleeter-two-stem.tar.bz2
          mkdir -p /tmp/spleeter-model
          tar -xjf /tmp/spleeter-two-stem.tar.bz2 -C /tmp/spleeter-model
          find /tmp/spleeter-model -name '*.onnx' -type f -print
      - name: Run real AI inference on original synthetic 20-second music (host only)
        run: |
          python experiments/two_stem_poc/run_host.py --model-root /tmp/spleeter-model --out-dir /tmp/stem-results --seconds ${{ matrix.seconds }}
      - uses: actions/upload-artifact@v4
        with:
          name: host-two-stem-${{ matrix.model }}-${{ matrix.seconds }}s-metrics-NOT-VITA
          path: /tmp/stem-results/metrics.json
          if-no-files-found: error
